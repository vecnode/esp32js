name: Build and publish qemu-esp32-win64

# Keeps physicalsim's own build unblocked from ever needing to build QEMU
# itself (CMakeLists.txt's BUNDLE_QEMU_XTENSA just downloads whatever this
# publishes) by rebuilding and republishing the one release asset it
# depends on automatically, every time this fork's xtensa-only tree
# changes - no manual "build it on my machine, upload it by hand" step.
#
# Always republishes to the SAME tag/asset name physicalsim's CMakeLists.txt
# already hardcodes (qemu-esp32-win64-v1 / qemu-esp32-win64.zip) rather than
# minting a new tag per run, so this workflow landing doesn't also require a
# physicalsim-side URL change - the existing FetchContent URL just always
# resolves to whatever this workflow most recently built.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSYS2 mingw64: the same environment this fork has always been built
      # from by hand (see physicalsim's CMakeLists.txt comment on
      # BUNDLE_QEMU_XTENSA) - QEMU's own build needs glib/pixman/SDL2 dev
      # packages and a real meson+ninja, not just a bare cross-compiler.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-libslirp
            zip

      - name: Configure (xtensa-softmmu only)
        shell: msys2 {0}
        run: |
          # --disable-fdt: the only xtensa board that ever needed a device
          # tree (xtfpga) is gone (hw/xtensa/meson.build's own comment) -
          # without this, meson's generic fdt probe falls through to
          # building the vendored dtc subproject from source, which fails
          # in CI anyway (no git available inside the msys2 shell to fetch
          # dtc.wrap) for a dependency esp32-picsimlab never uses.
          # --disable-containers: configure's own use_containers=yes default
          # probes `tests/docker/docker.py --engine ... probe` whenever a
          # docker/podman binary is on PATH, to test QEMU's Docker-based
          # cross-compilation infra - tests/ (and tests/docker with it) is
          # gone (physicalsim never runs QEMU's own test suite), so this
          # would fail if the windows-latest runner happens to have a
          # docker CLI on PATH, for a feature this build never uses anyway.
          ./configure --target-list=xtensa-softmmu --disable-werror --disable-docs --disable-tools --disable-fdt --disable-containers

      - name: Build
        shell: msys2 {0}
        run: |
          ninja -C build qemu-system-xtensa.exe

      # Every physicalsim board this fork ever emulates launches
      # "-machine esp32-picsimlab" and nothing else (see
      # hw/xtensa/meson.build's own comment) - one binary, one machine.
      - name: Package release zip
        shell: msys2 {0}
        run: |
          set -eu
          pkg=package
          rm -rf "$pkg"
          mkdir -p "$pkg/pc-bios"
          cp build/qemu-system-xtensa.exe "$pkg/"
          cp -r pc-bios/. "$pkg/pc-bios/"

          # Discovers this build's actual mingw64 runtime DLL dependencies
          # via ldd rather than a hand-maintained list - a package version
          # bump (glib/pixman/SDL2/curl/gnutls's own dependency chain
          # shifting) would otherwise silently go stale and produce a
          # release zip that's missing a DLL the next person only finds out
          # about when qemu-system-xtensa.exe fails to launch.
          for dll in $(ldd "$pkg/qemu-system-xtensa.exe" | grep -i '/mingw64/bin/' | awk '{print $3}'); do
            cp "$dll" "$pkg/"
          done

          cd "$pkg" && zip -r ../qemu-esp32-win64.zip . && cd ..
          ls -la qemu-esp32-win64.zip

      - name: Publish release (qemu-esp32-win64-v1, overwritten in place)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view qemu-esp32-win64-v1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create qemu-esp32-win64-v1 \
              --repo "${{ github.repository }}" \
              --title "qemu-esp32 win64 (auto-built)" \
              --notes "Automatically built from $(git rev-parse --short HEAD) by .github/workflows/release.yml. Only xtensa-softmmu / the esp32-picsimlab machine - see this repo's main branch history for what was trimmed and why."
          fi
          gh release upload qemu-esp32-win64-v1 qemu-esp32-win64.zip --repo "${{ github.repository }}" --clobber
